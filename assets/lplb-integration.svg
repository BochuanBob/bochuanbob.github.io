<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
  <title id="title">Current production and experimental edge-balance paths in LPLB</title>
  <desc id="desc">The current production Planner run method counts workload, calls the existing dense IPM through solve_probs, and uses weighted_select_target to return mapped physical expert indices. Separately, the experimental benchmark prepares edge colors, calls edge_balance_probs, and records routing fractions and diagnostics for comparison with HiGHS. The experimental path is not yet connected to Planner run.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".1"/></filter>
    <style>
      .heading{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.lane{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.07em}.label{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.body{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.tiny{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#64748b}.white{fill:#fff}.line{fill:none;stroke:#64748b;stroke-width:2.2;marker-end:url(#arrow)}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.4;rx:12;filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1100" height="600" rx="20" fill="#f8fafc"/>
  <text x="42" y="45" class="heading">Current integration status</text>

  <rect x="28" y="70" width="1044" height="202" rx="15" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="48" y="100" class="lane" fill="#2563eb">CURRENT PLANNER.RUN() PATH</text>
  <rect x="48" y="128" width="150" height="82" class="card"/><text x="68" y="159" class="label">Token indices</text><text x="68" y="183" class="tiny">idx</text>
  <path d="M198 169H238" class="line"/>
  <rect x="240" y="128" width="170" height="82" class="card"/><text x="260" y="158" class="label">Count workload</text><text x="260" y="182" class="tiny">count_workload()</text>
  <path d="M410 169H450" class="line"/>
  <rect x="452" y="128" width="180" height="82" class="card"/><text x="472" y="158" class="label">Dense IPM</text><text x="472" y="182" class="tiny">solve_probs()</text>
  <path d="M632 169H672" class="line"/>
  <rect x="674" y="128" width="190" height="82" class="card"/><text x="694" y="157" class="label">Select targets</text><text x="694" y="181" class="tiny">weighted_select_target()</text>
  <path d="M864 169H904" class="line"/>
  <rect x="906" y="128" width="146" height="82" rx="12" fill="#dbeafe" stroke="#60a5fa"/><text x="979" y="157" class="label" text-anchor="middle">Physical expert</text><text x="979" y="180" class="label" text-anchor="middle">indices</text><text x="979" y="200" class="tiny" text-anchor="middle">returned</text>
  <text x="48" y="244" class="body">This production path is unchanged.</text>

  <rect x="28" y="296" width="1044" height="244" rx="15" fill="#ecfdf5" stroke="#99f6e4"/>
  <text x="48" y="326" class="lane" fill="#0f766e">EXPERIMENTAL BENCHMARK PATH</text>
  <rect x="48" y="354" width="170" height="82" class="card"/><text x="68" y="384" class="label">Saved workloads</text><text x="68" y="408" class="body">benchmark corpus</text>
  <rect x="48" y="452" width="170" height="62" class="card"/><text x="68" y="479" class="label">Colored graph</text><text x="68" y="500" class="body">prepared metadata</text>
  <path d="M218 395H302" class="line"/><path d="M218 483H260V415H302" class="line"/>
  <rect x="304" y="354" width="218" height="82" rx="12" fill="#0f766e" filter="url(#shadow)"/><text x="413" y="384" class="label white" text-anchor="middle">Edge-balance CUDA</text><text x="413" y="410" class="tiny white" text-anchor="middle">edge_balance_probs()</text>
  <path d="M522 395H590" class="line"/>
  <rect x="592" y="354" width="202" height="82" class="card"/><text x="612" y="383" class="label">Fractions + diagnostics</text><text x="612" y="407" class="body">loads · gap · sweeps</text>
  <path d="M794 395H850" class="line"/>
  <rect x="852" y="354" width="200" height="82" class="card"/><text x="872" y="383" class="label">Validate and time</text><text x="872" y="407" class="body">compare with HiGHS</text>
  <rect x="304" y="462" width="748" height="52" rx="10" fill="#fff" stroke="#5eead4"/>
  <circle cx="330" cy="488" r="10" fill="#0f766e"/><text x="330" y="493" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff">!</text>
  <text x="352" y="493" class="body">Not yet called by Planner.run() or connected to weighted_select_target().</text>

  <text x="42" y="575" class="body">Dashed conceptual connection intentionally omitted: integration into the production path is future work.</text>
</svg>
