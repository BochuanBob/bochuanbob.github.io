<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
  <title id="title">The three-stage DeepSeek EPLB planning pipeline</title>
  <desc id="desc">Measured expert loads enter a hierarchical three-stage planner. Expert groups are packed onto nodes, redundant copies are allocated to heavy experts within each node, and physical expert copies are packed onto GPUs. The output consists of placement maps and replica counts used by the serving runtime.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".1"/></filter>
    <style>
      .title{font:700 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.sub{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.stage{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.07em}.label{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.body{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.tiny{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#64748b}.line{fill:none;stroke:#64748b;stroke-width:2.2;marker-end:url(#arrow)}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.4;rx:14;filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1100" height="540" rx="20" fill="#f8fafc"/>
  <text x="42" y="47" class="title">DeepSeek EPLB decomposes one placement problem into three greedy stages</text>
  <text x="42" y="73" class="sub">Hierarchy is used when expert groups divide evenly among nodes; otherwise the same logic runs globally.</text>

  <rect x="42" y="126" width="160" height="110" class="card"/>
  <text x="62" y="157" class="label">Load statistics</text>
  <text x="62" y="183" class="body">logical-expert demand</text>
  <text x="62" y="207" class="tiny">λₑ by layer</text>
  <path d="M202 181H244" class="line"/>

  <rect x="246" y="112" width="220" height="138" rx="15" fill="#eff6ff" stroke="#93c5fd" filter="url(#shadow)"/>
  <text x="268" y="142" class="stage" fill="#2563eb">STAGE 1 · TOPOLOGY</text>
  <text x="268" y="174" class="label">Pack groups onto nodes</text>
  <text x="268" y="200" class="body">heaviest group → lightest</text>
  <text x="268" y="222" class="body">nonfull node</text>
  <path d="M466 181H506" class="line"/>

  <rect x="508" y="112" width="220" height="138" rx="15" fill="#f0fdfa" stroke="#5eead4" filter="url(#shadow)"/>
  <text x="530" y="142" class="stage" fill="#0f766e">STAGE 2 · CAPACITY</text>
  <text x="530" y="174" class="label">Allocate replicas</text>
  <text x="530" y="200" class="body">split the largest</text>
  <text x="530" y="222" class="tiny">λₑ / rₑ</text>
  <path d="M728 181H768" class="line"/>

  <rect x="770" y="112" width="220" height="138" rx="15" fill="#fff7ed" stroke="#fdba74" filter="url(#shadow)"/>
  <text x="792" y="142" class="stage" fill="#c2410c">STAGE 3 · SCHEDULING</text>
  <text x="792" y="174" class="label">Pack copies onto GPUs</text>
  <text x="792" y="200" class="body">heaviest copy → lightest</text>
  <text x="792" y="222" class="body">nonfull GPU</text>

  <path d="M880 250V306" class="line"/>
  <rect x="770" y="308" width="220" height="132" class="card"/>
  <text x="792" y="339" class="label">Placement plan</text>
  <text x="792" y="366" class="body">physical → logical map</text>
  <text x="792" y="389" class="body">logical → physical map</text>
  <text x="792" y="412" class="body">replica counts</text>
  <path d="M770 374H696" class="line"/>

  <rect x="454" y="308" width="240" height="132" rx="14" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="476" y="339" class="label">Serving runtime</text>
  <text x="476" y="366" class="body">install maps and move weights</text>
  <text x="476" y="389" class="body">route tokens among replicas</text>
  <text x="476" y="415" class="tiny">different timescale from planning</text>

  <rect x="42" y="474" width="948" height="42" rx="9" fill="#e0f2fe"/>
  <text x="62" y="500" class="body">EPLB determines where expert copies exist; runtime routing determines which copy serves each individual token.</text>
</svg>
