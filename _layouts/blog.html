<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}">
    <title>{{ page.title }} · {{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav" aria-label="Primary navigation">
        <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <div class="site-links">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/#blogs' | relative_url }}">Blogs</a>
        </div>
      </nav>
    </header>

    <main class="article-shell">
      <article class="article">
        {{ content }}
      </article>
    </main>

    <footer class="site-footer">
      <p>© {{ 'now' | date: '%Y' }} {{ site.title }}</p>
    </footer>
  </body>
</html>
